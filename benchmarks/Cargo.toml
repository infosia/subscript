[package]
name = "subscript-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The benchmark harnesses. `perf-gate` is the P4 performance gate: it measures the hand-written C baseline, the ship-tier AOT build, the dev-tier JIT, and the emitted-C ship path on the a22 corpus entry in one session (specs/blocks/compiler.md sections 3 and 9). `cross-language` is the cross-language suite: it measures subscript against C/LuaJIT/JSC/V8 on the workloads under workloads/ (specs/blocks/benchmarks.md). Both bins are auto-discovered from src/bin/ and share aot-entry.c."

# Both bins are auto-discovered from src/bin/ (bin name = file name):
#   perf-gate      <- src/bin/perf-gate.rs
#   cross-language <- src/bin/cross-language.rs

[dependencies]
subscript-codegen = { path = "../codegen" }
subscript-compiler = { path = "../compiler" }
