[package]
name = "subscript-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "The P4 performance-gate harness: measures the hand-written C baseline, the ship-tier AOT build, and the dev-tier JIT on the a22 corpus entry in one session (specs/blocks/compiler.md sections 3 and 9)."

[[bin]]
name = "bench"
path = "src/main.rs"

# The cross-language benchmark suite runner (specs/blocks/benchmarks.md). Its
# sources live under benchmarks/ next to the workloads it measures; it reuses
# this crate's codegen/compiler dependencies and the AOT timing entry.
[[bin]]
name = "benchmarks"
path = "../benchmarks/runner.rs"

[dependencies]
subscript-codegen = { path = "../codegen" }
subscript-compiler = { path = "../compiler" }
