[package]
name = "mobile-link-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "P0.5 mobile link spike: emits a fixed program via cranelift-object for aarch64-linux-android and aarch64-apple-ios"

[dependencies]
cranelift-codegen = { version = "=0.125.4", features = ["arm64"] }
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
cranelift-object = "=0.125.4"
target-lexicon = "=0.13.5"

[dev-dependencies]
object = { version = "0.36", default-features = false, features = ["read", "std"] }
