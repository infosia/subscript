[package]
name = "subscript-compiler"
version = "0.1.0"
edition = "2021"
description = "Semantic checker and typed HIR for the subscript language (plan phase P1)."

[dependencies]
subscript-boundary = { path = "../boundary" }
oxc_allocator = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_ast = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_ast_visit = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_parser = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15", default-features = false }
oxc_semantic = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
oxc_span = { git = "https://github.com/infosia/oxc", rev = "43ad6ed5043f524f78c16a2d874b5fc588942a15" }
regress = { git = "https://github.com/infosia/regress", branch = "subscript-exec-budget" }
