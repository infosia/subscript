[package]
name = "subscript-compiler"
version = "0.1.0"
edition = "2021"
description = "Semantic checker and typed HIR for the subscript language (plan phase P1)."

[dependencies]
# swc_common 5.0.1 imports `serde::__private`, which later serde 1.x releases
# removed; the pin keeps the resolved serde at a version that still has it.
serde = "=1.0.219"
swc_common = "=5.0.1"
swc_ecma_ast = "=5.1.0"
swc_ecma_parser = "=6.0.2"
regress = { git = "https://github.com/infosia/regress", branch = "subscript-exec-budget" }
