[package]
name = "subscript-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Developer command for checking, emitting, building, and running subscript programs."

[[bin]]
name = "subscript"
path = "src/main.rs"

[dependencies]
subscript-bindgen = { path = "../bindgen" }
subscript-codegen = { path = "../codegen" }
subscript-compiler = { path = "../compiler" }

# §109.2 rule 6: the budgeted compile child sets its own memory budget.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
