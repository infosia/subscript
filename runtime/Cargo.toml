[package]
name = "subscript-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "The subscript runtime shared by both execution tiers: Context memory, strings, arrays, traps, coroutine frame storage, and Q14 numeric formatting behind a C-ABI-stable boundary."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
num-bigint = "0.4.8"
num-traits = "0.2.19"
ryu-js = "=1.0.3"
# Forked for the execution budget the contract requires (stdlib.md §15.4);
# upstream has none at any version. Pinned by commit in Cargo.lock.
regress = { git = "https://github.com/infosia/regress", branch = "subscript-exec-budget" }
