[package]
name = "subscript-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "The subscript runtime shared by both execution tiers: Context memory, strings, arrays, traps, coroutine frame storage, and Q14 numeric formatting behind a C-ABI-stable boundary."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
num-bigint = "0.4.8"
num-traits = "0.2.19"
ryu-js = "=1.0.3"
