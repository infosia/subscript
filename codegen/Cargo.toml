[package]
name = "subscript-codegen"
version = "0.1.0"
edition = "2021"
publish = false
description = "HIR-to-CLIF lowering and both execution tiers of subscript. The lowering is tier-neutral: it targets any cranelift-module backend, so the dev-tier JIT and the ship-tier AOT object emitter share it unchanged."

[features]
# Opt-in only for the golden-capture helper: links the synthetic interop
# fixture so interop entries use the same dev-JIT capture path as ordinary
# entries without adding the fixture to production codegen binaries.
capture-interop = []

[dependencies]
subscript-compiler = { path = "../compiler" }
subscript-runtime = { path = "../runtime" }
# `arm64` is explicit: the ship tier emits objects for the two arm64
# device triples regardless of what the host architecture is.
# Every ship-target backend, host-independent: the retained
# Cranelift-object cross-check emits arm64 (iOS/Android) and x86-64
# (linux-gnu) objects on every dev host (compiler.md §11 "Ship
# targets"). host-arch alone made the x86-64 triple fail on arm64.
cranelift-codegen = { version = "=0.125.4", features = ["arm64", "x86"] }
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
cranelift-jit = "=0.125.4"
cranelift-native = "=0.125.4"
cranelift-object = "=0.125.4"
target-lexicon = "=0.13.5"
libc = "0.2"
# Used only on windows-msvc, to locate the MSVC `cl` toolchain and its
# INCLUDE/LIB/PATH environment via the registry (compiler.md §11c). Unused
# on every other host; a regular dependency because `src/aot.rs` (library
# code) calls `cc::windows_registry`.
cc = "1"

[dev-dependencies]
# Object-file inspection for the AOT emission tests, as in the P0.5
# spike; the same version the spike pins.
object = { version = "0.36", default-features = false, features = ["read", "std"] }
# This fixture has no `_Float16`, so the MSVC gate keeps it.
subscript-archive-fixture = { path = "tests/archive-fixture" }

# The interop fixture's build script compiles `corpus/interop/interop.c`,
# which uses `_Float16` — a type MSVC `cl` cannot compile. Gate it off
# windows-msvc; every test path that names its symbols is excluded there
# too (compiler.md §11c). Mirrors `examples/Cargo.toml`.
[target.'cfg(not(all(windows, target_env = "msvc")))'.dev-dependencies]
# Compiles and links the synthetic C fixture only into tests that name it;
# production binaries linking subscript-codegen carry no fixture object.
subscript-interop-fixture = { path = "tests/native-fixture" }

[build-dependencies]
cc = "1"
